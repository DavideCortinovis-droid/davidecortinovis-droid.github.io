intro:
  title: Hello!
  # Interests and education are folded into this prose rather than given their
  # own sidebar blocks, since Albertine has no structured slot for them.
  body: >
    I am a researcher in the Object Vision Group at the
    [Centre for Mind/Brain Sciences (CIMeC)](https://webapps.unitn.it/du/en/Persona/PER0221111/Pubblicazioni),
    University of Trento.
    I investigate the topographic organization of object categories and dimensions
    in visual cortex and in artificial neural networks.


    My interests span visual neuroscience, neuroimaging, and computational
    modelling. I hold a PhD in Cognitive and Brain Sciences and an MSc in
    Cognitive Neuroscience from the University of Trento, and a BSc in
    Psychology from the University of Bergamo.
