intro:
  # Rendered as the large heading above the body, so the body starts at
  # "I am a researcher" to avoid saying "Hello!" twice.
  title: Hello!
  body: >
    I am a researcher in visual neuroscience. I did my PhD at the
    [Center for Mind/Brain Sciences](https://www.cimec.unitn.it/en) at the
    University of Trento, in the
    [Object Vision Group](https://www.cimec.unitn.it/en/1048/object-vision-group)
    led by [Stefania Bracci](https://webapps.unitn.it/du/en/Persona/PER0076943/Curriculum).
    In my [PhD thesis](https://iris.unitn.it/bitstream/11572/483110/1/PhD_Thesis_Cortinovis.pdf),
    I investigated the topographic organization of object categories and
    dimensions in visual cortex and in artificial neural networks.
