#   name        - required, the heading
#   description - required, markdown is allowed
#   image       - optional, a path under /img/. Omit it and the text takes the
#                 full width instead of leaving a gap.
#   url         - optional, makes the name a link
-
  name: Project one
  description: >
    A short description of the project goes here. A couple of sentences saying
    what the question was, what you did, and what came out of it is usually
    enough. **Markdown** and [links](https://example.com) work.
  image: /img/project-placeholder.svg
  url:
