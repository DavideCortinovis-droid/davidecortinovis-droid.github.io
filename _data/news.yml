-
  date: 8 May 2026
  body: >
    My work on food selectivity in visual cortex received the
    [Best Poster Award](https://drive.google.com/file/d/1-SocL9xnwCB2fm83OvzF40Tt1HdpW-Cs/view?usp=sharing)
    at the [CAOs Workshop](https://event.unitn.it/cimec-caos/)!
-
  date: 20 Apr 2026
  body: >
    **I defended [my thesis](https://iris.unitn.it/bitstream/11572/483110/1/PhD_Thesis_Cortinovis.pdf)
    and earned my PhD!**
-
  date: 13 Apr 2026
  body: >
    A [preprint](https://www.biorxiv.org/content/10.64898/2026.04.09.717525v1.abstract)
    based on one study from my PhD thesis is now available.
-
  date: 21 Dec 2025
  body: >
    I published the main [paper](https://www.nature.com/articles/s41467-025-67855-6)
    of my PhD thesis in *Nature Communications*: Investigating action topography
    in visual cortex and deep artificial neural networks!!
-
  date: 12 Aug 2025
  body: >
    **[CCN](https://2025.ccneuro.org/) in Amsterdam, the Netherlands:**
    I presented a
    [poster](https://2025.ccneuro.org/abstract_pdf/Cortinovis_2025_Comparing_Object_Selectivity_Visual_Cortex_Topographic.pdf)
    on comparing object selectivity in visual cortex and topographic deep neural
    networks.
-
  date: 17 May 2025
  body: >
    **[VSS](https://www.visionsciences.org/) in St Pete Beach, Florida, US:**
    I gave a [talk](https://jov.arvojournals.org/article.aspx?articleid=2810196)
    on object dimensions underlying food selectivity in visual cortex.
-
  date: 22–27 Jun 2024
  body: >
    **OHBM in Seoul, South Korea:** I gave a
    [talk](https://www.youtube.com/watch?v=ws3nZaWWNvY) on action-related
    topographic organization of category-selectivity in visual cortex and in
    artificial neural networks.
